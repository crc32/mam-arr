[project]
name = "mamarr"
version = "2.0.0"
description = "MyAnonamouse audiobook MCP service with library inventory sync"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "apscheduler>=3.10.0",
]

[project.scripts]
mamarr = "mamarr.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mamarr"]
